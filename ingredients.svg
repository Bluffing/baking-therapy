<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Repeating background tile: outline baking ingredients, one color -->
  <g fill="none" stroke="#d9c0a3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Egg -->
    <g transform="translate(60 62) rotate(-14)">
      <path d="M0 -27 C14 -27 22 -5 22 8 C22 21 12 29 0 29 C-12 29 -22 21 -22 8 C-22 -5 -14 -27 0 -27 Z"/>
      <path d="M-9 -8 C-12 -2 -13 4 -12 10"/>
    </g>

    <!-- Whisk -->
    <g transform="translate(190 70) rotate(28)">
      <rect x="-4.5" y="12" width="9" height="30" rx="4"/>
      <path d="M-4 12 C-20 -8 -14 -38 0 -38 C14 -38 20 -8 4 12"/>
      <path d="M-2 12 C-10 -6 -7 -30 0 -38 C7 -30 10 -6 2 12"/>
      <path d="M0 12 L0 -38"/>
    </g>

    <!-- Rolling pin -->
    <g transform="translate(330 60) rotate(-20)">
      <rect x="-28" y="-9" width="56" height="18" rx="7"/>
      <path d="M-28 0 H-36 M28 0 H36"/>
      <rect x="-50" y="-5" width="14" height="10" rx="5"/>
      <rect x="36" y="-5" width="14" height="10" rx="5"/>
      <path d="M-14 -9 V9 M0 -9 V9 M14 -9 V9" stroke-width="1.4"/>
    </g>

    <!-- Wheat -->
    <g transform="translate(70 200) rotate(12)">
      <path d="M0 42 C0 18 0 -10 0 -38"/>
      <path d="M0 -14 C-12 -16 -14 -28 -10 -34 C-4 -30 0 -24 0 -14"/>
      <path d="M0 -14 C12 -16 14 -28 10 -34 C4 -30 0 -24 0 -14"/>
      <path d="M0 2 C-12 0 -14 -12 -10 -18 C-4 -14 0 -8 0 2"/>
      <path d="M0 2 C12 0 14 -12 10 -18 C4 -14 0 -8 0 2"/>
      <path d="M0 18 C-12 16 -14 4 -10 -2 C-4 2 0 8 0 18"/>
      <path d="M0 18 C12 16 14 4 10 -2 C4 2 0 8 0 18"/>
      <path d="M0 -30 C-4 -36 -2 -42 0 -46 C2 -42 4 -36 0 -30"/>
    </g>

    <!-- Flour bag -->
    <g transform="translate(200 210) rotate(-6)">
      <path d="M-22 -22 L22 -22 L27 34 L-27 34 Z"/>
      <path d="M-22 -22 L-18 -32 L-9 -25 L0 -33 L9 -25 L18 -32 L22 -22"/>
      <rect x="-14" y="-4" width="28" height="22" rx="3"/>
      <path d="M-6 13 C-6 5 0 1 0 1 C0 1 6 5 6 13 M0 1 V16" stroke-width="1.6"/>
    </g>

    <!-- Measuring cup -->
    <g transform="translate(340 200) rotate(10)">
      <path d="M-22 -24 H18 L13 30 H-17 Z"/>
      <path d="M18 -14 C34 -14 34 16 15 16"/>
      <path d="M-13 -10 H-4 M-13 0 H-7 M-13 10 H-4 M-13 20 H-7" stroke-width="1.6"/>
      <path d="M-22 -24 L-27 -30"/>
    </g>

    <!-- Cookie -->
    <g transform="translate(70 340)">
      <path d="M0 -26 C10 -26 18 -22 22 -14 C26 -6 28 4 24 12 C20 21 10 27 0 27 C-12 27 -22 20 -25 10 C-28 0 -26 -10 -20 -18 C-15 -24 -8 -26 0 -26 Z"/>
      <circle cx="-9" cy="-9" r="3"/>
      <circle cx="8" cy="-12" r="2.5"/>
      <circle cx="10" cy="6" r="3"/>
      <circle cx="-6" cy="11" r="2.5"/>
      <circle cx="-15" cy="2" r="2"/>
    </g>

    <!-- Butter -->
    <g transform="translate(200 345) rotate(-8)">
      <path d="M-30 -4 L8 -4 L28 -16 L-10 -16 Z"/>
      <path d="M-30 -4 V14 H8 V-4"/>
      <path d="M8 14 L28 2 V-16"/>
      <path d="M-18 -4 V14" stroke-width="1.4"/>
    </g>

    <!-- Mixing bowl + spoon -->
    <g transform="translate(335 340) rotate(-4)">
      <path d="M14 -6 L30 -38"/>
      <ellipse cx="32" cy="-43" rx="5" ry="8" transform="rotate(27 32 -43)"/>
      <path d="M-34 -6 H34 C34 18 18 30 0 30 C-18 30 -34 18 -34 -6 Z"/>
      <path d="M-12 30 V36 H12 V30"/>
    </g>
  </g>
</svg>
